name: CI

# Only PRs and pushes to main spawn workflow runs — plain branch pushes would
# otherwise start a vacuous pipeline that can race the PR pipeline. Releases
# live in release.yml and are triggered manually.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Changelog gate: every PR must add an entry to CHANGELOG.md under
  # '## Unreleased' — the release job later uses that section as the
  # release body.
  changelog:
    name: Changelog gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry
        run: |
          # Defensive: the three-dot diff below needs a merge base with the
          # target branch, so make sure we have it locally.
          git fetch origin "${{ github.base_ref }}"
          # Require at least one ADDED, non-blank, non-heading line in the
          # CHANGELOG.md diff — approximates "entry under '## Unreleased'" (it
          # checks for added content lines, not their position); a deletion-only
          # touch of the file does not pass.
          ADDED=$(git diff -U0 "origin/${{ github.base_ref }}...HEAD" -- CHANGELOG.md | grep -E '^\+[^+]' | grep -vE '^\+##' | grep -vE '^\+[[:space:]]*$' || true)
          if [ -n "$ADDED" ]; then
            echo "CHANGELOG.md entry added — OK"
          else
            echo "ERROR: this PR does not add an entry to CHANGELOG.md."
            echo "Add an entry under '## Unreleased' in the matching section"
            echo "(Features / Fixes / Internal improvements) and push again."
            exit 1
          fi

  # Unit tests + integration tests + plugin build. The GitButler CLI integration
  # tests need a Docker daemon; GitHub-hosted ubuntu runners provide one (unlike
  # the previous Codeberg CI runners), so they now run instead of self-skipping.
  test:
    name: Test and build plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test buildPlugin --no-daemon
