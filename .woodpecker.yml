# Only PRs, pushes to main, and manual runs spawn pipelines — plain branch
# pushes would otherwise start a vacuous clone-only pipeline that can race the
# PR pipeline. Releases are cut by manually running the pipeline on main from
# the Woodpecker UI.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  # Changelog gate: every PR must add an entry to CHANGELOG.md under
  # '## Unreleased' — the release step later uses that section as the
  # release body.
  changelog:
    image: alpine/git
    commands:
      # Defensive: Woodpecker clones can be shallow, and the three-dot diff
      # below needs a merge base. No-op when the clone is already complete.
      - git fetch --unshallow origin "$CI_COMMIT_TARGET_BRANCH" || true
      - git fetch origin $CI_COMMIT_TARGET_BRANCH
      # Require at least one ADDED, non-blank, non-heading line in the
      # CHANGELOG.md diff — approximates "entry under '## Unreleased'" (it
      # checks for added content lines, not their position); a deletion-only
      # touch of the file does not pass.
      - |
        ADDED=$(git diff -U0 origin/$CI_COMMIT_TARGET_BRANCH...HEAD -- CHANGELOG.md | grep -E '^\+[^+]' | grep -vE '^\+##' | grep -vE '^\+[[:space:]]*$' || true)
      - |
        if [ -n "$ADDED" ]; then
          echo "CHANGELOG.md entry added — OK"
        else
          echo "ERROR: this PR does not add an entry to CHANGELOG.md."
          echo "Add an entry under '## Unreleased' in the matching section"
          echo "(Features / Fixes / Internal improvements) and push again."
          exit 1
        fi
    when:
      - event: pull_request

  # Unit tests + integration tests + plugin build. Runs on every PR, on pushes
  # to main, and again before a manual release. The GitButler CLI integration
  # tests need a Docker daemon; on runners without one (Codeberg CI does not
  # offer docker-in-docker) they self-skip via an Assume and only the unit
  # tests gate the build.
  test:
    image: eclipse-temurin:21-jdk
    commands:
      - ./gradlew test buildPlugin --no-daemon
    when:
      - event: pull_request
      - event: push
        branch: main
      - event: manual

  # CalVer with a per-day counter: YYYY.M.D.N where N is 1 for the first release
  # of the day and increments for each further release the same day. The counter
  # is derived from existing releases, so it resets naturally each new day.
  # The release steps (version, build, release, changelog-cut) only fire on
  # manual runs on main — a manual run on a feature branch just tests.
  version:
    image: alpine:3.20
    environment:
      TOKEN:
        from_secret: codeberg_token
    commands:
      - apk add --no-cache curl jq
      - Y=$(date -u +%Y)
      - M=$(date -u +%m | sed 's/^0//')
      - D=$(date -u +%d | sed 's/^0//')
      - DATE="$Y.$M.$D"
      - |
        MAX=$(curl -sSf -H "Authorization: token $TOKEN" \
          "https://codeberg.org/api/v1/repos/$CI_REPO/releases?limit=50" \
          | jq -r '.[].tag_name' \
          | grep "^$${DATE}\." | sed "s/^$${DATE}\.//" | sort -n | tail -1 || true)
      - MAX=$${MAX:-0}
      - VERSION="$DATE.$((MAX + 1))"
      - echo "$VERSION" > version.txt
      - 'echo "Version for this build: $VERSION"'
    when:
      - event: manual
        branch: main

  build:
    image: eclipse-temurin:21-jdk
    commands:
      - ./gradlew buildPlugin --no-daemon -PpluginVersion="$(cat version.txt)"
    when:
      - event: manual
        branch: main

  release:
    image: alpine:3.20
    environment:
      TOKEN:
        from_secret: codeberg_token
    commands:
      - apk add --no-cache curl jq
      - set -e
      - VERSION=$(cat version.txt)
      - ZIP=$(ls build/distributions/*-$VERSION.zip | head -1)
      # The release body is the '## Unreleased' section of CHANGELOG.md
      # (everything between '## Unreleased' and the next '## ' heading),
      # with empty '### ' subsections stripped and blank lines collapsed.
      - |
        NOTES=$(awk '/^## Unreleased$/{flag=1;next} /^## /{flag=0} flag' CHANGELOG.md)
      - |
        NOTES=$(printf '%s\n' "$NOTES" | awk '
          function flush() {
            if (heading == "" || has) {
              if (heading != "") print heading
              printf "%s", buf
            }
            heading = ""; buf = ""; has = 0
          }
          /^### / { flush(); heading = $0; next }
          { buf = buf $0 "\n"; if ($0 ~ /[^[:space:]]/) has = 1 }
          END { flush() }
        ' | awk '
          NF { if (started && pending) print ""; print; started = 1; pending = 0; next }
          { pending = 1 }
        ')
      - |
        if [ -z "$(printf '%s\n' "$NOTES" | grep -v '^###' | grep -v '^[[:space:]]*$' || true)" ]; then
          echo "ERROR: the '## Unreleased' section of CHANGELOG.md has no entries."
          echo "Add at least one changelog entry before cutting a release."
          exit 1
        fi
      - echo "Releasing $ZIP as $VERSION"
      # Create the release (Forgejo creates the tag at this commit if missing).
      - |
        BODY=$(jq -n \
          --arg tag "$VERSION" \
          --arg tgt "$CI_COMMIT_SHA" \
          --arg name "$VERSION" \
          --arg body "$NOTES" \
          '{tag_name:$tag, target_commitish:$tgt, name:$name, body:$body, draft:false, prerelease:false}')
      - |
        RELEASE_ID=$(curl -sSf -X POST \
          -H "Authorization: token $TOKEN" \
          -H "Content-Type: application/json" \
          -d "$BODY" \
          "https://codeberg.org/api/v1/repos/$CI_REPO/releases" | jq -r '.id')
      - echo "Created release $RELEASE_ID"
      # Attach the plugin zip as a release asset.
      - |
        curl -sSf -X POST \
          -H "Authorization: token $TOKEN" \
          -F "attachment=@$ZIP" \
          "https://codeberg.org/api/v1/repos/$CI_REPO/releases/$RELEASE_ID/assets?name=$(basename $ZIP)"
    when:
      - event: manual
        branch: main

  # After a release, stamp the released version into CHANGELOG.md: the current
  # '## Unreleased' heading becomes '## <VERSION> - <date>' and a fresh empty
  # Unreleased scaffold is inserted above it. The commit carries [skip ci] so
  # the push back to main does not trigger another pipeline.
  changelog-cut:
    image: alpine/git
    environment:
      TOKEN:
        from_secret: codeberg_token
    commands:
      - set -e
      - VERSION=$(cat version.txt)
      - TODAY=$(date -u +%Y-%m-%d)
      - |
        awk -v ver="$VERSION" -v day="$TODAY" '
          /^## Unreleased$/ && !done {
            print "## Unreleased"
            print ""
            print "### Features"
            print ""
            print "### Fixes"
            print ""
            print "### Internal improvements"
            print ""
            print "## " ver " - " day
            done=1
            next
          }
          { print }
        ' CHANGELOG.md > CHANGELOG.md.new
      - mv CHANGELOG.md.new CHANGELOG.md
      - git config user.name "woodpecker-ci"
      - git config user.email "ci@codeberg.org"
      - git add CHANGELOG.md
      - 'git commit -m "chore: cut changelog for $VERSION [skip ci]"'
      # Protects against anything having landed on main since the pipeline
      # started — replay the single changelog commit onto the current tip.
      - git fetch origin main
      - git rebase FETCH_HEAD
      - git push "https://x:$TOKEN@codeberg.org/$CI_REPO.git" HEAD:main
    when:
      - event: manual
        branch: main
